<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One line · 10 Lavender</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<style>
  :root{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55);--lav:#5a48d6}
  html.dark{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--lav:#a99bff}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:760px;padding:60px}
  p{margin:0;font-size:clamp(22px,2.4vw,30px);line-height:1.5;font-weight:400;letter-spacing:-.01em}
  .sig{margin-top:1.2em;font-size:.65em;color:var(--lav)}
  a{color:var(--lav);text-decoration:none;transition:opacity .2s}
  a:hover{text-decoration:underline;text-underline-offset:.15em}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:40px 28px}.theme{right:24px}}
</style>
</head>
<body>
<main>
  <p>I'm building <a href="https://hypercubic.ai">Hypercubic</a> and I <a href="https://www.anticynical.com/">write</a> sometimes.</p>
  <p class="sig">— Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
