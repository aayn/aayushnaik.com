<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One line · 01 Baseline</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<style>
  /* Light: off-white paper, solid ink, duller violet, soft underline. Dark: unchanged. */
  :root{--bg:#f6f5f2;--fg:#111;--dim:rgba(0,0,0,.55);--lav:#4a3fa8;--ul:rgba(74,63,168,.35);--w:400}
  html.dark{--bg:#000;--fg:rgba(255,255,255,.88);--dim:rgba(255,255,255,.5);--lav:#a99bff;--ul:#a99bff;--w:300}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{padding:60px}
  p{margin:0;font-size:17px;line-height:1.75;font-weight:var(--w)}
  .sig{margin-top:1.75em}
  a{color:var(--lav);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--ul);transition:text-decoration-color .2s}
  a:hover{text-decoration-color:transparent}
  .ico{width:.72em;height:.72em;margin-left:.18em;vertical-align:-.02em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:40px 28px}.theme{right:24px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="ext" viewBox="0 0 16 16"><path d="M7 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V9"/><path d="M9 2h5v5M14 2 7.5 8.5"/></symbol></svg>
<main>
  <p>I'm building <a href="https://hypercubic.ai">Hypercubic<svg class="ico"><use href="#ext"/></svg></a> and I <a href="https://www.anticynical.com/">write<svg class="ico"><use href="#ext"/></svg></a> sometimes.</p>
  <p class="sig">-- Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
