<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One line · 03 Serif, centered</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbf8f1;--fg:rgba(43,38,32,.92);--dim:rgba(43,38,32,.55);--rule:rgba(43,38,32,.2);--solid:#1a1612}
  html.dark{--bg:#0c0a08;--fg:rgba(216,207,191,.92);--dim:rgba(216,207,191,.5);--rule:rgba(216,207,191,.22);--solid:#f3ead7}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);text-align:center;
    font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;-webkit-font-smoothing:antialiased}
  main{max-width:720px;padding:60px 28px}
  p{margin:0;font-size:clamp(24px,2.6vw,32px);line-height:1.45}
  .sig{margin-top:1.4em;font-style:italic;font-size:.7em;color:var(--dim)}
  a{color:var(--solid);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;text-decoration-color:var(--rule);transition:text-decoration-color .2s}
  a:hover{text-decoration-color:var(--solid)}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){.theme{right:24px}}
</style>
</head>
<body>
<main>
  <p>I'm building <a href="https://hypercubic.ai">Hypercubic</a> and I <a href="https://www.anticynical.com/">write</a> sometimes.</p>
  <p class="sig">Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
