<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One line · 05 Mono</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:rgba(0,0,0,.88);--dim:rgba(0,0,0,.5);--rule:rgba(0,0,0,.2);--solid:#000}
  html.dark{--bg:#000;--fg:rgba(255,255,255,.88);--dim:rgba(255,255,255,.5);--rule:rgba(255,255,255,.22);--solid:#fff}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
  main{padding:60px;font-size:15px;line-height:1.85}
  p{margin:0}
  .sig{margin-top:1.85em;color:var(--dim)}
  a{color:var(--solid);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule)}
  a:hover{text-decoration-color:var(--solid)}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:40px 24px;font-size:14px}.theme{right:24px}}
</style>
</head>
<body>
<main>
  <p>I'm building <a href="https://hypercubic.ai">Hypercubic</a> and I <a href="https://www.anticynical.com/">write</a> sometimes.</p>
  <p class="sig">-- Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
