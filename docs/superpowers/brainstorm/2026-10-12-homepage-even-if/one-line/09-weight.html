<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One line · 09 Weight</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55)}
  html.dark{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.6)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--fg);
    font-family:"Archivo",system-ui,sans-serif;font-weight:200;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:1100px;margin:0 auto;padding:60px 72px}
  h1{margin:0;font-size:clamp(36px,5.6vw,76px);font-weight:200;line-height:1.08;letter-spacing:-.01em}
  a{color:var(--fg);font-weight:800;letter-spacing:-.03em;text-decoration:none;transition:opacity .2s}
  a:hover{opacity:.6}
  .sig{margin-top:40px;font-size:18px;color:var(--dim)}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:48px 28px}.theme{right:24px}}
</style>
</head>
<body>
<main>
  <h1>I'm building <a href="https://hypercubic.ai">Hypercubic</a><br>and I <a href="https://www.anticynical.com/">write</a> sometimes.</h1>
  <p class="sig">— Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
