<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One line · 02 Headline</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55);--rule:rgba(0,0,0,.18)}
  html.dark{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--rule:rgba(255,255,255,.2)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--fg);
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:1100px;margin:0 auto;padding:60px 72px}
  h1{margin:0;font-size:clamp(34px,5.4vw,74px);font-weight:300;line-height:1.1;letter-spacing:-.025em}
  .sig{margin-top:40px;font-size:17px;color:var(--dim)}
  a{color:var(--fg);text-decoration:underline;text-underline-offset:.12em;text-decoration-thickness:1px;text-decoration-color:var(--rule);transition:text-decoration-color .2s}
  a:hover{text-decoration-color:var(--fg)}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:48px 28px}.theme{right:24px}}
</style>
</head>
<body>
<main>
  <h1>I'm building <a href="https://hypercubic.ai">Hypercubic</a><br>and I <a href="https://www.anticynical.com/">write</a> sometimes.</h1>
  <p class="sig">— Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
