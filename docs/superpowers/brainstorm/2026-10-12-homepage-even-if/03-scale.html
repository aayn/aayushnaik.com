<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · Scale contrast</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55);--rule:rgba(0,0,0,.14)}
  html.dark{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.62);--rule:rgba(255,255,255,.16)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--fg);
    font-family:"Space Grotesk",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:1100px;margin:0 auto;padding:60px 72px}
  .premises{margin:0 0 .9em;font-size:16px;line-height:1.7;color:var(--dim);letter-spacing:.005em}
  h1{margin:0;font-size:clamp(40px,6.4vw,88px);font-weight:300;line-height:1.04;letter-spacing:-.025em;max-width:15ch}
  .foot{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:baseline;margin-top:64px;padding-top:24px;border-top:1px solid var(--rule);font-size:16px;color:var(--dim)}
  .foot .name{color:var(--fg)}
  a{color:var(--fg);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule);transition:text-decoration-color .2s}
  a:hover{text-decoration-color:var(--fg)}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:48px 28px}.theme{right:24px}.foot{margin-top:48px}}
</style>
</head>
<body>
<main>
  <p class="premises">EVEN IF<br>The world is far from perfect.<br>The universe is silent.<br>Almost no one cares about you.<br>You will soon die.<br><br>EVEN IF all that is true,</p>
  <h1>I choose to live a beautiful existence.</h1>
  <div class="foot">
    <span class="name">Aayush Naik</span>
    <span>I'm building <a href="https://hypercubic.ai" target="_blank" rel="noopener">Hypercubic</a> and I <a href="https://www.anticynical.com/" target="_blank" rel="noopener">write</a> sometimes.</span>
  </div>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
