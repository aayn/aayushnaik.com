<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · Hanging "Even if"</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbf8f1;--fg:rgba(43,38,32,.9);--dim:rgba(43,38,32,.55);--rule:rgba(43,38,32,.16);--solid:#1a1612}
  html.dark{--bg:#0c0a08;--fg:rgba(216,207,191,.9);--dim:rgba(216,207,191,.5);--rule:rgba(216,207,191,.18);--solid:#f3ead7}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;-webkit-font-smoothing:antialiased}
  main{max-width:760px;padding:60px}
  .row{display:grid;grid-template-columns:88px 1fr;column-gap:28px;font-size:23px;line-height:1.5}
  .row+.row{margin-top:1.5em}
  .lead{font-style:italic;color:var(--dim)}
  .body{margin:0}
  hr{border:0;border-top:1px solid var(--rule);margin:48px 0 44px}
  .bio{font-size:19px;line-height:1.6}
  .bio .body{color:var(--dim)}
  a{color:var(--solid);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;text-decoration-color:var(--rule);transition:text-decoration-color .2s}
  a:hover{text-decoration-color:var(--solid)}
  .sig{font-style:italic;margin-top:1.4em;color:var(--fg)}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){
    main{padding:48px 28px}
    .row{grid-template-columns:1fr;font-size:20px}
    .lead{margin-bottom:.2em}
    .theme{right:24px}
  }
</style>
</head>
<body>
<main>
  <div class="row">
    <span class="lead">Even if</span>
    <p class="body">the world is far from perfect.<br>the universe is silent.<br>almost no one cares about you.<br>you will soon die.</p>
  </div>
  <div class="row">
    <span class="lead">Even if</span>
    <p class="body">all that is true, I choose to live a beautiful existence.</p>
  </div>
  <hr>
  <div class="row bio">
    <span class="lead"></span>
    <p class="body">I'm building <a href="https://hypercubic.ai" target="_blank" rel="noopener">Hypercubic</a> and I <a href="https://www.anticynical.com/" target="_blank" rel="noopener">write</a> sometimes.<br><span class="sig" style="display:inline-block">Aayush Naik</span></p>
  </div>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
