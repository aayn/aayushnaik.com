<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · Cobalt</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<style>
  :root{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.55);--rule:rgba(0,0,0,.14);--accent:#1a3fd6}
  html.dark{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.55);--rule:rgba(255,255,255,.16);--accent:#7f99ff}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:720px;padding:60px}
  p{margin:0;font-size:21px;line-height:1.6;font-weight:400;letter-spacing:-.005em}
  .premises{margin-bottom:1.6em}
  .resolution{color:var(--accent)}
  hr{border:0;border-top:1px solid var(--rule);margin:48px 0}
  .bio{color:var(--dim);font-size:19px}
  a{color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;text-decoration-color:transparent;transition:text-decoration-color .2s}
  a:hover{text-decoration-color:var(--accent)}
  .sig{margin-top:1.6em;font-size:19px}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){main{padding:40px 28px}p{font-size:19px}.theme{right:24px}}
</style>
</head>
<body>
<main>
  <p class="premises">EVEN IF<br>The world is far from perfect.<br>The universe is silent.<br>Almost no one cares about you.<br>You will soon die.</p>
  <p class="resolution">EVEN IF all that is true, I choose to live a beautiful existence.</p>
  <hr>
  <p class="bio">I'm building <a href="https://hypercubic.ai" target="_blank" rel="noopener">Hypercubic</a> and I <a href="https://www.anticynical.com/" target="_blank" rel="noopener">write</a> sometimes.</p>
  <p class="sig">— Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
