<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · Frontispiece</title>
<script>(()=>{const t=localStorage.getItem('v-theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#111;--dim:rgba(0,0,0,.55);--rule:rgba(0,0,0,.25)}
  html.dark{--bg:#000;--fg:#ededed;--dim:rgba(255,255,255,.55);--rule:rgba(255,255,255,.3)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:"Cormorant Garamond",Garamond,Georgia,serif;-webkit-font-smoothing:antialiased;text-align:center}
  main{max-width:640px;padding:60px 28px}
  p{margin:0}
  .premises{font-style:italic;font-size:27px;line-height:1.5;color:var(--dim)}
  .premises .even{font-style:normal;font-variant:small-caps;letter-spacing:.12em;color:var(--fg)}
  .resolution{margin-top:1.4em;font-size:31px;font-weight:500;line-height:1.4}
  .rule{width:28px;height:1px;background:var(--rule);margin:56px auto 48px}
  .bio{font-size:20px;line-height:1.6;color:var(--dim)}
  a{color:var(--fg);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-decoration-color:var(--rule);transition:text-decoration-color .2s}
  a:hover{text-decoration-color:var(--fg)}
  .sig{margin-top:1.2em;font-variant:small-caps;letter-spacing:.14em;font-size:19px}
  .theme{position:fixed;top:28px;right:48px;background:none;border:0;color:inherit;opacity:.35;cursor:pointer;font-size:18px;padding:4px}
  .theme:hover{opacity:.8}
  @media(max-width:640px){.premises{font-size:23px}.resolution{font-size:26px}.theme{right:24px}}
</style>
</head>
<body>
<main>
  <p class="premises"><span class="even">Even if</span><br>the world is far from perfect.<br>the universe is silent.<br>almost no one cares about you.<br>you will soon die.</p>
  <p class="resolution">Even if all that is true,<br>I choose to live a beautiful existence.</p>
  <div class="rule"></div>
  <p class="bio">I'm building <a href="https://hypercubic.ai" target="_blank" rel="noopener">Hypercubic</a> and I <a href="https://www.anticynical.com/" target="_blank" rel="noopener">write</a> sometimes.</p>
  <p class="sig">Aayush Naik</p>
</main>
<button class="theme" aria-label="Toggle light/dark" onclick="localStorage.setItem('v-theme',document.documentElement.classList.toggle('dark')?'dark':'light')">◐</button>
</body>
</html>
